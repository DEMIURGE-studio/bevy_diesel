[package]
name = "bevy_diesel"
version = "0.4.0"
edition = "2024"
description = "A generic ability engine framework for Bevy"
license = "MIT OR Apache-2.0"
repository = "https://github.com/DEMIURGE-studio/bevy_diesel"
homepage = "https://github.com/DEMIURGE-studio/bevy_diesel"
keywords = ["bevy", "abilities", "gamedev", "ecs"]
categories = ["game-development", "game-engines"]

[dependencies]
bevy = { version = "0.19.0", default-features = false, features = ["bevy_log", "bevy_scene", "bevy_asset"] }
rand = "0.9"
inventory = "0.3"
bevy_gauge = "0.5"
bevy_gearbox = { version = "0.8", default-features = false, features = ["gauge"] }

[features]
default = []
server = ["bevy_gearbox/server"]
diesel_diagnostics = []